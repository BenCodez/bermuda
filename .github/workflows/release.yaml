---
name: Release

# Lifted shamelessly from https://github.com/custom-components/grocy

on:
  release:
    types: [published]

permissions: {}

jobs:
  release_zip_file:
    name: Prepare and upload release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      BERMUDA_RELEASE_ZIP: "${{ github.workspace }}/bermuda.zip"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Build and verify the release package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/build_release.py "$RELEASE_TAG" "$BERMUDA_RELEASE_ZIP"

      - name: 🔏 Sign release package
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: "${{ env.BERMUDA_RELEASE_ZIP }}"

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ env.BERMUDA_RELEASE_ZIP }}
          fail_on_unmatched_files: true
